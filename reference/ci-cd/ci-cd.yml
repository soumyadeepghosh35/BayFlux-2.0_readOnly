name: CI/CD amd64 (main to Docker Hub dev)

# Builds the amd64 image, runs pytest inside it, and only then updates
#   <dockerhub-user>/<image>:dev            newest tested build of main
#   <dockerhub-user>/<image>:dev-previous   the dev image from before the last update
# Release tags (2.0) and latest are never touched here.
on:
  push:
    branches: [main]
    # Documentation-only changes do not rebuild a long image.
    paths-ignore:
      - "mac_arm64/**"
      - "docs/**"
      - "release/**"
      - "**/*.md"
      - ".github/workflows/ci-cd-arm64.yml"

env:
  IMAGE: <dockerhub-user>/<image>

concurrency:
  group: ci-cd-amd64
  cancel-in-progress: true

jobs:
  test-build-publish:
    # Native amd64 runner. The CUDA base image is amd64 only.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The image is about 16 GB and the build needs more headroom than that.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/share/swift /opt/az /usr/local/.ghcup /usr/lib/google-cloud-sdk /usr/lib/jvm
          sudo apt-get clean
          sudo docker image prune --all --force
          df -h /

      # No setup-buildx-action. The default Docker driver builds straight into
      # the daemon image store. A buildx container builder kept the layers,
      # wrote a tarball and loaded it again, which filled the disk.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Built locally, not pushed. The tests live inside the image.
      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:dev
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Disk after build
        if: always()
        run: df -h /

      # A non-zero exit stops the job, so nothing below runs on a failing build.
      # The image provides python3 only, not python.
      - name: Run test suite
        run: |
          docker run --rm --platform linux/amd64 --shm-size=4g "$IMAGE:dev" \
            bash -c "cd /bayflux && python3 -m pytest tests -q"

      # Copy the current dev image to dev-previous on Docker Hub (a registry-side
      # retag, nothing is pulled), then replace dev.
      - name: Back up current dev, then push new dev
        run: |
          if docker buildx imagetools inspect "$IMAGE:dev" > /dev/null 2>&1; then
            docker buildx imagetools create -t "$IMAGE:dev-previous" "$IMAGE:dev"
          else
            echo "No existing dev tag, nothing to back up"
          fi
          docker push "$IMAGE:dev"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:dev"
